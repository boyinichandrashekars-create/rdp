name: RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Configure RDP
        shell: powershell
        run: |
          # Enable Remote Desktop
          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0 `
            -Force

          # Allow RDP through Windows Firewall
          netsh advfirewall firewall delete rule name="RDP-Tailscale"
          netsh advfirewall firewall add rule `
            name="RDP-Tailscale" `
            dir=in `
            action=allow `
            protocol=TCP `
            localport=3389

          # Restart Remote Desktop service
          Restart-Service -Name TermService -Force

      - name: Create RDP User
        shell: powershell
        run: |
          # Character sets
          $Upper = [char[]](65..90)
          $Lower = [char[]](97..122)
          $Number = [char[]](48..57)
          $Special = [char[]](33..47)

          # Generate password
          $rawPassword = @()
          $rawPassword += $Upper | Get-Random -Count 4
          $rawPassword += $Lower | Get-Random -Count 4
          $rawPassword += $Number | Get-Random -Count 4
          $rawPassword += $Special | Get-Random -Count 4

          $password = -join ($rawPassword | Sort-Object { Get-Random })

          $securePassword = ConvertTo-SecureString `
            $password `
            -AsPlainText `
            -Force

          # Create user
          New-LocalUser `
            -Name "RDP" `
            -Password $securePassword `
            -AccountNeverExpires

          # Add required groups
          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member "RDP"

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member "RDP"

          # Save credentials for later steps
          "RDP_USERNAME=RDP" >> $env:GITHUB_ENV
          "RDP_PASSWORD=$password" >> $env:GITHUB_ENV

          Write-Host "RDP user created successfully."

      - name: Install Tailscale
        shell: powershell
        run: |
          $url = "https://dl.tailscale.com/stable/tailscale-setup-1.102.4-amd64.msi"
          $installer = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $installer

          Start-Process `
            "msiexec.exe" `
            -ArgumentList "/i", "`"$installer`"", "/quiet", "/norestart" `
            -Wait

          Remove-Item $installer -Force

          Write-Host "Tailscale installed successfully."

      - name: Connect Tailscale
        shell: powershell
        env:
          TS_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not (Test-Path $tailscale)) {
            Write-Error "Tailscale executable not found."
            exit 1
          }

          & $tailscale up `
            --auth-key="$env:TS_AUTH_KEY" `
            --hostname="gh-rdp-$env:GITHUB_RUN_ID"

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Tailscale connection failed."
            exit 1
          }

          Write-Host "Tailscale connected."

      - name: Get Tailscale IP
        shell: powershell
        run: |
          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"
          $tsIP = $null

          for ($i = 0; $i -lt 20; $i++) {
            $tsIP = (& $tailscale ip -4 2>$null).Trim()

            if ($tsIP) {
              break
            }

            Start-Sleep -Seconds 3
          }

          if (-not $tsIP) {
            Write-Error "Tailscale IP was not assigned."
            exit 1
          }

          "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

          Write-Host "Tailscale IP: $tsIP"

      - name: Verify RDP
        shell: powershell
        run: |
          Write-Host "Testing RDP on $env:TAILSCALE_IP..."

          $result = Test-NetConnection `
            -ComputerName $env:TAILSCALE_IP `
            -Port 3389 `
            -WarningAction SilentlyContinue

          if (-not $result.TcpTestSucceeded) {
            Write-Error "RDP port 3389 is not reachable."
            exit 1
          }

          Write-Host "RDP connection test successful."

      - name: Show RDP Credentials
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "========================================"
          Write-Host "             RDP ACCESS"
          Write-Host "========================================"
          Write-Host "Address : $env:TAILSCALE_IP"
          Write-Host "Username: $env:RDP_USERNAME"
          Write-Host "Password: $env:RDP_PASSWORD"
          Write-Host "========================================"
          Write-Host ""

      - name: Keep RDP Alive
        shell: powershell
        run: |
          while ($true) {
            Write-Host "[$(Get-Date)] RDP is active..."
            Start-Sleep -Seconds 300
          }
